<!doctype html>
<meta charset="utf-8">
<script type="module">
  import { env, AutoProcessor, CLIPVisionModelWithProjection, RawImage } from "/_aif/transformers/transformers.min.js";
  env.allowRemoteModels = false; env.allowLocalModels = true;
  env.localModelPath = "/_aif/models/";
  env.backends.onnx.wasm.wasmPaths = "/_aif/transformers/";
  env.backends.onnx.wasm.numThreads = 1;
  const id = "Xenova/mobileclip_s0";
  const text = await (await fetch("../ai/text.json")).json();
  const proc = await AutoProcessor.from_pretrained(id);
  const out = [];
  for (const dtype of ["q8", "fp16"]) {
    const model = await CLIPVisionModelWithProjection.from_pretrained(id, { dtype });
    for (const f of ["Kichta_ref.png", "Siamese_cats_0.jpg", "White_cats_0.jpg", "Persian_cats_0.jpg"]) {
      const image = await RawImage.read("/_aif/photos/" + f);
      const inputs = await proc(image);
      const { image_embeds } = await model(inputs);
      const e = Array.from(image_embeds.data); const n = Math.hypot(...e); const v = e.map((x) => x / n);
      const probs = {};
      for (const g of ["iscat", "pattern", "color", "breed"]) {
        const G = text.groups[g];
        const l = G.emb.map((t) => 100 * t.reduce((s, x, i) => s + x * v[i], 0));
        const m = Math.max(...l); const ex = l.map((x) => Math.exp(x - m)); const S = ex.reduce((a, b) => a + b);
        probs[g] = G.labels.map((lab, k) => [lab, Math.round(100 * ex[k] / S)]).sort((a, b) => b[1] - a[1]).slice(0, 3).map((x) => x.join(" ")).join(", ");
      }
      out.push(`${dtype} ${f} dims=${image_embeds.dims} input=${inputs.pixel_values.dims} px0=${inputs.pixel_values.data.slice(0, 3).join(",")} | ${JSON.stringify(probs)}`);
    }
  }
  window.result = out; window.ready = true;
</script>
