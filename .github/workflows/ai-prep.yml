# Prépare les fichiers de l'IA « Mon chat » (modèle, moteur, photos de test) et les met en téléchargement.
name: Préparation IA Mon chat
on:
  push:
    branches: [ai-prep]
permissions:
  contents: write
jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Moteurs (transformers.js et onnxruntime-web)
        run: |
          mkdir -p out/lib && cd out/lib
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts @huggingface/transformers@3
          mkdir -p ../transformers ../ort
          cp -r node_modules/@huggingface/transformers/dist/* ../transformers/
          ORT=node_modules/onnxruntime-web; grep '"version"' $ORT/package.json; cp $ORT/dist/ort.wasm.min.mjs $ORT/dist/ort-wasm-simd-threaded.wasm $ORT/dist/ort-wasm-simd-threaded.mjs $ORT/dist/ort.webgpu.min.mjs $ORT/dist/ort-wasm-simd-threaded.jsep.* ../ort/ || ls $ORT/dist
          ls -la ../ort ../transformers | head -40
          cd .. && rm -rf lib
      - name: Modèles
        run: |
          pip install -q huggingface_hub
          python - <<'P'
          from huggingface_hub import snapshot_download, list_repo_files
          for repo in ["Xenova/mobileclip_s0"]:
              try:
                  files = list_repo_files(repo); print(repo, files)
                  allow = [f for f in files if f.endswith(".json") or f.endswith(".txt") or f in ("onnx/vision_model.onnx", "onnx/text_model_fp16.onnx", "onnx/vision_model_fp16.onnx")]
                  snapshot_download(repo, local_dir="out/models/" + repo, allow_patterns=allow)
                  import shutil; shutil.rmtree("out/models/" + repo + "/.cache", ignore_errors=True)
              except Exception as e:
                  print("échec", repo, e)
          P
          du -ah out/models | sort -h | tail -30
      - name: Photos de test (Oxford-IIIT Pet, races étiquetées ; jamais livrées dans le jeu)
        run: |
          mkdir -p out/photos
          (curl -fsSL --retry 3 -o pets.tgz https://thor.robots.ox.ac.uk/datasets/pets/images.tar.gz || curl -fsSL --retry 3 -o pets.tgz https://www.robots.ox.ac.uk/~vgg/data/pets/data/images.tar.gz) && tar xzf pets.tgz
          pip install -q pillow
          python3 - <<'P'
          import os, random
          from PIL import Image
          random.seed(7)
          cats = ["Abyssinian", "Bengal", "Birman", "Bombay", "British_Shorthair", "Egyptian_Mau", "Maine_Coon", "Persian", "Ragdoll", "Russian_Blue", "Siamese", "Sphynx"]
          files = os.listdir("images")
          for c in cats:
              mine = sorted(f for f in files if f.startswith(c + "_") and f.endswith(".jpg"))
              random.shuffle(mine)
              for f in mine[:14]:
                  try:
                      im = Image.open("images/" + f).convert("RGB"); im.thumbnail((512, 512)); im.save("out/photos/" + f, quality=85)
                  except Exception as e:
                      print("échec", f, e)
          print(len(os.listdir("out/photos")))
          P
          python3 tools-ai/fetch_photos.py out/photos-commons || true
      - name: Pousser les fichiers sur la branche ai-files
        run: |
          cd out
          rm -rf transformers/*.map transformers/*.cjs* 2>/dev/null || true
          find . -size +95M -print -delete
          git init -q -b ai-files
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Fichiers IA Mon chat (temporaires)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ai-files
